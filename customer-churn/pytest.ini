[pytest]
# Run tests from the customer-churn directory.
testpaths = tests

# Add the project root to sys.path so that "from src.xxx import yyy"
# resolves correctly without installing the package.
pythonpath = .

# Show short tracebacks and suppress noisy third-party warnings.
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
